name: Build with flet

on:
    # push:
    #     branches: ["main"]
    workflow_dispatch:

env:
    PROJECT_NAME: flet_nuitka_uv_arena
    PYTHON_VERSION: "3.10"
    UV_VERSION: "0.7.2"
    PYTHONUTF8: "1" # Python使用UTF-8编码
    SYSTEMROOT: "C:\\Windows" # Windows必要环境变量
jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    # - os: ubuntu-latest
                    #   target: x86_64-unknown-linux-gnu
                    #   ext: ""
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      ext: ".exe"
                    # - os: macos-latest
                    #   target: x86_64-apple-darwin
                    #   ext: ""
                    # - os: macos-latest
                    #   target: aarch64-apple-darwin
                    #   ext: ""

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python ${{ env.PYTHON_VERSION }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            # 3. 安装uv（全局安装）
            - name: Install uv globally
              uses: astral-sh/setup-uv@v5
              with:
                  # Install a specific version of uv.
                  version: ${{ env.UV_VERSION }}

            # 4. 安装依赖
            - name: Sync dependencies
              run: |
                  uv sync

            - name: Fix Windows console encoding
              if: runner.os == 'Windows'
              run: |
                  # 修改控制台编码为UTF-8
                  [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
                  # 设置环境变量防止rich库报错
                  echo "PYTHONLEGACYWINDOWSSTDIO=utf8" >> $env:GITHUB_ENV

            - name: Build with flet
              shell: bash
              run: |
                  mkdrir -p dist
                  uv run flet build windows
                  ls

            - name: Create zip archive
              run: |
                  $version = (Get-Date -Format "yyyyMMddHHmm")
                  $zipName = "${{ env.PROJECT_NAME }}_windows_${version}.zip"
                  Compress-Archive -Path "build\windows\*" -DestinationPath "dist\${zipName}" -Force

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows-app
                  path: |
                      dist\*.zip
                      build\windows\*.exe
                  if-no-files-found: error
